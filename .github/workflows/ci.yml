name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend1/requirements.txt

      - name: Install dependencies
        run: pip install -r backend1/requirements.txt

      - name: Unit and API tests
        run: pytest -q

      - name: RAG evaluation gate (offline baseline on the synthetic fixture)
        run: >
          python -m evals.run_eval
          --min-recall 0.9 --min-accuracy 0.75 --min-abstain 0.9
          --min-citation-precision 0.9 --max-leak 0

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: evals/results/latest.*

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t data-governance-platform .
      - name: Smoke test
        run: |
          docker run -d --name dgp -p 5000:5000 data-governance-platform
          for i in $(seq 1 20); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 1
          done
          docker logs dgp
          exit 1
